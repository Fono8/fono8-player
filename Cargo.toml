[workspace]
members = [".", "fono8-web", "ytm-core"]
default-members = [".", "fono8-web"]

[package]
name = "fono8"
version = "0.1.2"
edition = "2021"
description = "Fono8 - a compact music player for local files, YouTube Music and Spotify"
homepage = "https://fono8.com"
repository = "https://github.com/Fono8/fono8-player"
authors = ["Michał Krawczak <github@open8.co>"]
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.89"
build = "build.rs"

[[bin]]
name = "fono8"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
anyhow = "1"
rand = "0.9"
sys-locale = "0.3"
smallvec = "1"
unicode-segmentation = "1"
# Google Cast: discovery, Cast V2 over TLS, MP3 relay over HTTP.
mdns-sd = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
mp3lame-encoder = "0.2"
tiny_http = "0.12"
fono8-ytm-core = { path = "ytm-core" }
# YouTube Music thumbnails, Spotify Web API
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Spotify: PKCE sign-in, refresh token in the system keyring
sha2 = "0.10"
base64 = "0.22"
url = "2"
form_urlencoded = "1"
keyring = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 4

# xattr 0.2 (via gpui_http_client -> zed-async-tar) does not compile against libc >= 0.2.169.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
